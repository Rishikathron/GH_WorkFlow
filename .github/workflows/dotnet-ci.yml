
name: .NET CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build application
        run: dotnet build --no-restore

      # Upload compiled test binaries
      - name: Upload test binaries
        uses: actions/upload-artifact@v4
        with:
          name: test-build
          path: WorkflowSample.Tests/bin/Debug/net10.0/


  unit-tests:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Download compiled test binaries
      - name: Download test binaries
        uses: actions/download-artifact@v4
        with:
          name: test-build
          path: WorkflowSample.Tests/bin/Debug/net10.0/

      # Execute tests without rebuilding
      - name: Run unit tests
        run: dotnet vstest WorkflowSample.Tests/bin/Debug/net10.0/WorkflowSample.Tests.dll
